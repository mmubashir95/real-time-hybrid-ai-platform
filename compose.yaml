services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-30}
      DATABASE_URL: postgresql+asyncpg://realtime_ai:local_development_only@postgres:5432/realtime_ai
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "scripts.migrate_database", "upgrade"]
    environment:
      DATABASE_URL: postgresql+asyncpg://realtime_ai:local_development_only@postgres:5432/realtime_ai
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    # pgvector 0.8.7, built on the same PostgreSQL 17 Bookworm base image.
    # The digest pins the multi-platform image rather than a host architecture.
    image: pgvector/pgvector:0.8.7-pg17-bookworm@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    # Host-side development tools need PostgreSQL while retaining MPS access.
    # Bind only to loopback so the development database is not network-exposed.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: realtime_ai
      POSTGRES_USER: realtime_ai
      POSTGRES_PASSWORD: local_development_only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U realtime_ai -d realtime_ai
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
